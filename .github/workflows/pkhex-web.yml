name: PKHeX.Web

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/PKHeX.Web.React/**'
      - 'src/PKHeX.Facade/**'
      - 'src/PKHeX.Everywhere.Engine*/**'
      
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          
      - name: Update submodules to the latest commit
        run: |
          git submodule update --remote --recursive
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Build PKHeX.Web.React
        working-directory: src/PKHeX.Web.React
        env:
          VITE_GOOGLE_ANALYTICS: 'true'
          VITE_SENTRY: 'true'
        run: |
          npm ci
          npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifact-pkhex-web
          path: ./src/PKHeX.Web.React/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_publish

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
        
      - name: Checkout PKHeX.Web repository
        uses: actions/checkout@v4
        with:
          repository: pkhex-web/pkhex-web.github.io
          ref: gh-pages
          path: pkhex-web
          token: ${{ secrets.GIT_HUB_PKHEX_WEB_TOKEN }}

      - name: Copy artifacts to Github pages repository
        run: |
          cp -R artifacts/artifact-pkhex-web/* pkhex-web/

      - name: Commit and push new artifacts
        run: |
          cd pkhex-web
          touch .nojekyll
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git add --all
          git commit -m "Update PKHeX.Web artifacts"
          git push origin
          cd ..
