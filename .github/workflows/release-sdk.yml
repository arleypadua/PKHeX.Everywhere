name: Release SDK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/PKHeX.Everywhere.Engine.Sdk/**'
      - '.github/workflows/release-sdk.yml'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Engine SDK dependencies
        working-directory: src/PKHeX.Everywhere.Engine.Sdk
        run: npm ci

      - name: Open the Version Packages PR or publish
        uses: changesets/action@v2
        with:
          cwd: src/PKHeX.Everywhere.Engine.Sdk
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
