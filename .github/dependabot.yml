# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # The generators run inside the compiler, so their Roslyn version must stay
    # at or below the compiler in the oldest SDK global.json allows.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
    groups:
      nuget:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/src/PKHeX.Everywhere.Engine.Sdk"
      - "/src/PKHeX.Everywhere.Engine.Sdk/docs"
      - "/src/PKHeX.Web.React"
      - "/src/PKHeX.Web.React/blog"
    schedule:
      interval: "weekly"
    # Security updates only: a limit of 0 turns off version updates, not security updates.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
